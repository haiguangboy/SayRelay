name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-3.0
      - name: Create virtual environment
        run: /usr/bin/python3 -m venv --system-site-packages .ci-venv
      - name: Install package
        run: .ci-venv/bin/python -m pip install .
      - name: Run unit tests
        run: .ci-venv/bin/python -m unittest discover -s tests -v
